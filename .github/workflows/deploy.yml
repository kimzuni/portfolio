---
name: Deploy

run-name: Deploy (${{ github.event.release.tag_name }})

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

on:
  release:
    types:
      - published

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: |
          UNIX_TIMESTAMP="$(date +%s)"
          NEXT_PUBLIC_RELEASE_DATE="${UNIX_TIMESTAMP}000" vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Generate Markdown Message
        run: |
          echo "### 🚀 Vercel Preview Deployed!" > summary.md
          echo "🔗 **Preview URL:** <${{ steps.deploy.outputs.PREVIEW_URL }}>" >> summary.md

      - name: Write Job Summary
        run: |
          cat summary.md >> $GITHUB_STEP_SUMMARY
